<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Meridian Estates">
  <title>Meridian Estates</title>
  <!--
    The mark: a surveyed plot.

    An outer boundary with its top-right corner cut back - the same notch the
    plot-card uses, so the mark and the interface are drawn from one idea. Inside
    it, the meridian: a copper arc crossing a forest north-south line, with two
    contour rules behind it for the land the plot sits on.
  -->
  <defs>
    <linearGradient id="me-plot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#245B4A"/>
      <stop offset="100%" stop-color="#173F35"/>
    </linearGradient>
  </defs>

  <!-- The plot boundary, top-right corner cut back. -->
  <path
    d="M6 6 H34 L42 14 V42 H6 Z"
    fill="url(#me-plot)"
  />

  <!-- Contour rules: the lay of the land behind the survey line. -->
  <path d="M6 30 C14 26, 20 34, 27 30 S38 24, 42 28" fill="none" stroke="#2E7D6E" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M6 36 C15 32, 21 39, 28 35 S39 30, 42 34" fill="none" stroke="#2E7D6E" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- The meridian: the north-south line, and the copper arc that names it. -->
  <path d="M20 8 V42" fill="none" stroke="#D6B77A" stroke-width="2" stroke-linecap="round"/>
  <path d="M13 20 A7 7 0 0 1 27 20" fill="none" stroke="#B87333" stroke-width="2" stroke-linecap="round"/>

  <!-- The cut corner, drawn as a copper edge so the notch reads as a fold. -->
  <path d="M34 6 L42 14" fill="none" stroke="#B87333" stroke-width="2" stroke-linecap="round"/>
</svg>
