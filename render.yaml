# ============================================================================
# Meridian Estates — Real Estate Management Dashboard
#
# A Render Blueprint. With this file in the repository, "New > Blueprint" reads
# it and provisions the service and the database together, so the deployment is
# a file in version control rather than a sequence of clicks nobody recorded.
#
# Two things it deliberately relies on:
#
#   * `DATABASE_URL` is a *connection string*, not a JDBC URL. The service
#     normalises it at startup (see DataSourceUrlNormaliser), so no part of the
#     database's address has to be copied out of the dashboard by hand.
#   * `JWT_SECRET` is generated, never written down here. The service refuses to
#     start against a non-local database without it, and a signing key committed
#     to a public repository would let anyone mint a valid token for this
#     installation.
#
# Validate a change to this file before pushing it:
#   render blueprints validate render.yaml
# ============================================================================

services:
  - type: web
    name: meridian-estates
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    # Worth paying for on anything shown to a client. Render's free plan sleeps
    # after inactivity, so the first request after a quiet spell waits for a JVM
    # to start; and 512 MB is tight for this service, which loads Apache POI for
    # the spreadsheet import. 1c-2g is the smallest comfortable size.
    plan: 1c-2g
    healthCheckPath: /api/v1/health/readiness
    autoDeployTrigger: commit
    envVars:
      # ---- Database -------------------------------------------------------
      # Composed for the service; the parts (host, port, database, user,
      # password) are taken from this URL at startup.
      - key: DATABASE_URL
        fromDatabase:
          name: meridian-estates-db
          property: connectionString
      # The schema the product owns. Flyway creates it on first start, which is
      # why the role has to own the database rather than merely connect to it.
      - key: DB_SCHEMA
        value: real_estate

      # ---- Runtime --------------------------------------------------------
      - key: APP_ENV
        value: production
      # The dashboard and the API share one origin, so CORS never applies to
      # them. This is listed anyway so the value is correct if the API is ever
      # called from somewhere else - a second frontend, or a test harness.
      # Update it if the service is renamed, since the URL follows the name.
      - key: CORS_ALLOWED_ORIGINS
        value: https://meridian-estates.onrender.com

      # ---- Secrets --------------------------------------------------------
      # Generated by Render, and the only value in this file that is not
      # readable. Changing it invalidates every issued token, which is exactly
      # what a rotation should do.
      - key: JWT_SECRET
        generateValue: true

      # ---- The firm -------------------------------------------------------
      # One installation serves one firm, so its identity is configuration. This
      # is the block to edit when rebranding a purchased installation; the
      # remaining thresholds in the service's application.yml keep their
      # documented defaults and can be added here as they need changing.
      - key: FIRM_NAME
        value: Meridian Estates
      - key: FIRM_CODE
        value: ME-001
      - key: FIRM_EMAIL
        value: advisory@meridianestates.example
      - key: FIRM_PHONE
        value: +91-22-6155-4400
      - key: FIRM_ADDRESS
        value: Meridian House, 14 Ballard Estate, Fort, Mumbai 400001
      - key: FIRM_LICENCE
        value: RERA/ME/2026/0114

databases:
  - name: meridian-estates-db
    # Pinned rather than generated, so the connection string is predictable and
    # the product owns exactly one database called `real_estate`.
    databaseName: real_estate
    user: real_estate
    region: singapore
    plan: 0.5c-1g
    # Matches the version the migrations and the seed data were verified against.
    postgresMajorVersion: '18'
